<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title">
  <title id="title">SM1M Global Trading Analytics</title>
  <defs>
    <filter id="dark-to-alpha" color-interpolation-filters="sRGB">
      <feColorMatrix type="luminanceToAlpha" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="7" intercept="-0.16" />
      </feComponentTransfer>
    </filter>
    <mask id="logo-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1536" height="1024">
      <image href="sm1m-logo-v2.png" width="1536" height="1024" filter="url(#dark-to-alpha)" />
    </mask>
  </defs>
  <image
    href="sm1m-logo-v2.png"
    width="1536"
    height="1024"
    mask="url(#logo-mask)"
  />
</svg>
